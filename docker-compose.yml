# Shared definition of the three Spark containers (one image, same env and
# mounts); each service below only adds its name, command and ports.
x-spark: &spark
  build:
    context: ./streaming
    dockerfile: Dockerfile
  image: gaming-spark:3.5.1
  environment:
    - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    - REDIS_HOST=redis
    - REDIS_PORT=6379
  volumes:
    - ./streaming:/opt/spark-apps
    - ./data/checkpoints:/tmp/spark-checkpoints
    - ./data/parquet:/tmp/gaming-data/parquet
  networks:
    - gaming-net

services:
  # ─── Kafka (KRaft mode - Official Apache Kafka) ─────────────────────────
  kafka:
    image: apache/kafka:3.7.0
    container_name: gaming-kafka
    ports:
      # Host clients (simulator, benchmarks) use EXTERNAL on 9094. PLAINTEXT
      # 9092 advertises kafka:9092 — only reachable on the compose network —
      # so it is not published.
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics come only from kafka-init, with their intended partition
      # counts. With auto-create on, any client that merely asked for a
      # topic first (e.g. a simulator started early) created it with the
      # broker's default partition count, and kafka-init's --if-not-exists
      # kept it so.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Keep the log on the kafka_data volume. Unset, the broker writes to
      # /tmp/kafka-logs in the container layer and every recreate drops all
      # topics and offsets.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - gaming-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─── Kafka Topic Initialization ─────────────────────────────────────────
  # One-shot: exits 0 once every topic exists; api and alert-engine wait for
  # that (service_completed_successfully). Any failed create exits non-zero.
  kafka-init:
    image: apache/kafka:3.7.0
    container_name: gaming-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - gaming-net
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic gameplay_events --partitions 6 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic player_events --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic server_metrics --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic alerts --partitions 1 --replication-factor 1
        echo 'Kafka topics ready.'

  # ─── Spark Master ───────────────────────────────────────────────────────
  # Jobs are submitted with `docker exec gaming-spark-master spark-submit`
  # (make spark-submit), so the 7077 master port stays on the compose network.
  spark-master:
    <<: *spark
    container_name: gaming-spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master --host spark-master --port 7077 --webui-port 8080
    ports:
      - "8080:8080" # Spark Master Web UI

  # ─── Spark Workers ──────────────────────────────────────────────────────
  spark-worker-1:
    <<: *spark
    container_name: gaming-spark-worker-1
    depends_on:
      - spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077 --cores 2 --memory 2G

  spark-worker-2:
    <<: *spark
    container_name: gaming-spark-worker-2
    depends_on:
      - spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077 --cores 2 --memory 2G

  # ─── Redis (Real-time State Store) ──────────────────────────────────────
  # Redis >= 7 is required: the alert engine's gates use SET ... NX GET.
  redis:
    image: redis:7-alpine
    container_name: gaming-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - gaming-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── PostgreSQL (Alert History & Metadata) ───────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: gaming-postgres
    environment:
      - POSTGRES_DB=gaming_platform
      - POSTGRES_USER=gaming
      - POSTGRES_PASSWORD=gaming_dev
    ports:
      - "5433:5432" # Mapped host port 5433 -> container 5432 to avoid host collision
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gaming-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gaming -d gaming_platform"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── FastAPI Backend ────────────────────────────────────────────────────
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: gaming-api
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=gaming
      - POSTGRES_PASSWORD=gaming_dev
      - POSTGRES_DB=gaming_platform
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    networks:
      - gaming-net
    restart: unless-stopped

  # ─── Go Alert Engine (Phase 4) ──────────────────────────────────────────
  # Empty values select the engine's defaults (TTLs 5m, webhook disabled);
  # see alert-engine/config.go and the README's Configuration section.
  alert-engine:
    build:
      context: ./alert-engine
      dockerfile: Dockerfile
    container_name: gaming-alert-engine
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=gaming
      - POSTGRES_PASSWORD=gaming_dev
      - POSTGRES_DB=gaming_platform
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:-}
      - ALERT_DEDUP_TTL=${ALERT_DEDUP_TTL:-}
      - ALERT_RATE_LIMIT_TTL=${ALERT_RATE_LIMIT_TTL:-}
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - gaming-net
    restart: unless-stopped

networks:
  gaming-net:
    driver: bridge

volumes:
  kafka_data:
  redis_data:
  postgres_data:
