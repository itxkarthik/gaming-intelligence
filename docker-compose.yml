services:
  # ─── Kafka (KRaft mode - Official Apache Kafka) ─────────────────────────
  kafka:
    image: apache/kafka:3.7.0
    container_name: gaming-kafka
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - gaming-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Kafka Topic Initialization ─────────────────────────────────────────
  kafka-init:
    image: apache/kafka:3.7.0
    container_name: gaming-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - gaming-net
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "
      echo 'Waiting for Kafka to be ready...'
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic gameplay_events --partitions 6 --replication-factor 1
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic player_events --partitions 3 --replication-factor 1
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic server_metrics --partitions 3 --replication-factor 1
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic alerts --partitions 1 --replication-factor 1
      echo 'Kafka topics created successfully.'
      "

  # ─── Spark Master (Official Apache Spark) ───────────────────────────────
  spark-master:
    image: apache/spark:3.5.1
    container_name: gaming-spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master --host spark-master --port 7077 --webui-port 8080
    ports:
      - "8080:8080" # Spark Master Web UI
      - "7077:7077" # Spark Master Port
    volumes:
      - ./streaming:/opt/spark-apps
    networks:
      - gaming-net

  # ─── Spark Worker 1 (Official Apache Spark) ─────────────────────────────
  spark-worker-1:
    image: apache/spark:3.5.1
    container_name: gaming-spark-worker-1
    depends_on:
      - spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077 --cores 2 --memory 2G
    volumes:
      - ./streaming:/opt/spark-apps
    networks:
      - gaming-net

  # ─── Spark Worker 2 (Official Apache Spark) ─────────────────────────────
  spark-worker-2:
    image: apache/spark:3.5.1
    container_name: gaming-spark-worker-2
    depends_on:
      - spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077 --cores 2 --memory 2G
    volumes:
      - ./streaming:/opt/spark-apps
    networks:
      - gaming-net

  # ─── Redis (Real-time State Store) ──────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: gaming-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - gaming-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── PostgreSQL (Alert History & Metadata) ───────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: gaming-postgres
    environment:
      - POSTGRES_DB=gaming_platform
      - POSTGRES_USER=gaming
      - POSTGRES_PASSWORD=gaming_dev
    ports:
      - "5433:5432" # Mapped host port 5433 -> container 5432 to avoid host collision
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gaming-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gaming -d gaming_platform"]
      interval: 5s
      timeout: 3s
      retries: 5

networks:
  gaming-net:
    driver: bridge

volumes:
  kafka_data:
  redis_data:
  postgres_data:
