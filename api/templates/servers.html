{% extends "base.html" %}
{% block title %}Server Health{% endblock %}
{% block content %}
<div class="stats-row" id="servers-stats">{{ stats|safe }}</div>

<section class="panel">
  <div class="panel-header">
    <h2>// SERVER INFRASTRUCTURE TELEMETRY <span class="hint">10s Tumbling Windows · Live PySpark</span></h2>
    <span class="hint">Poll interval 2s</span>
  </div>
  <div class="table-wrap scroll-y max-h-560">
    <table>
      <thead>
        <tr>
          <th>Server</th><th>Region</th><th class="w-24">Health Score</th><th>Status</th>
          <th class="num">Avg CPU</th><th class="num">Avg RAM</th><th class="num">Avg Latency</th><th class="num">Peak Players</th>
        </tr>
      </thead>
      <tbody id="server-rows">
        {{ rows|safe }}
      </tbody>
    </table>
  </div>
</section>
{% endblock %}
